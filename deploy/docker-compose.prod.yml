# SPJ em modo demonstração na VPS (spec 002, ADR-0004). Vive em /opt/spj-crud. As imagens são
# construídas na máquina do Heitor e enviadas por SSH (deploy/deploy.sh). Variáveis em
# /opt/spj-crud/.env (fora do Git, chmod 600): TAG, POSTGRES_PASSWORD, JWT_SECRET, DEMO_EMAIL,
# DEMO_PASSWORD. O Postgres não publica porta: só a rede interna o alcança.
name: spj

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: spj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: spj
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spj -d spj"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [interna]
    mem_limit: 256m
    logging: *logging

  backend:
    image: spj-backend:${TAG:?}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://spj:${POSTGRES_PASSWORD}@db:5432/spj?schema=public
      PORT: 3001
      NODE_ENV: production
      FRONTEND_URL: https://spj.heitoroliveiro.dev
      PUBLIC_BACKEND_URL: https://spj.heitoroliveiro.dev
      JWT_SECRET: ${JWT_SECRET:?}
      TRUST_PROXY: 1
      DEMO_MODE: "true"
      DEMO_EMAIL: ${DEMO_EMAIL:?}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?}
    networks:
      interna: {}
      edge:
        aliases: [spj-api]
    mem_limit: 384m
    cpus: 1.0
    logging: *logging

  frontend:
    image: spj-frontend:${TAG:?}
    restart: unless-stopped
    networks:
      edge:
        aliases: [spj-web]
    mem_limit: 64m
    logging: *logging

networks:
  interna: {}
  edge:
    external: true

volumes:
  pgdata:
